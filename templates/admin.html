<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - GUAMC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }</style>
</head>
<body class="min-h-screen pb-10">

    <nav class="bg-emerald-950 text-white shadow-md px-6 py-4 flex justify-between items-center">
        <div>
            <h1 class="font-extrabold text-base">GUAMC Admin Panel</h1>
            <p class="text-[11px] text-emerald-300">Management & Student Database</p>
        </div>
        <div>
            <a href="{{ url_for('logout') }}" class="px-3.5 py-1.5 rounded-lg bg-emerald-800 hover:bg-rose-700 text-xs font-bold text-white transition shadow-sm">
                Logout
            </a>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto p-4 space-y-6 mt-4">
        
        <div class="bg-white rounded-2xl shadow-sm border border-emerald-100 p-6 flex justify-between items-center">
            <div>
                <h2 class="text-lg font-extrabold text-emerald-950">Registered Students Directory</h2>
                <p class="text-xs text-gray-500">Total Students: <span class="font-bold text-gray-800">{{ students|length }}</span></p>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-emerald-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-emerald-50 text-[11px] font-bold text-emerald-900 uppercase tracking-wider border-b border-emerald-100">
                            <th class="p-4">Roll</th>
                            <th class="p-4">Name</th>
                            <th class="p-4">Course</th>
                            <th class="p-4">Batch</th>
                            <th class="p-4">Email</th>
                            <th class="p-4">Phone</th>
                        </tr>
                    </thead>
                    <tbody class="text-xs text-gray-700 divide-y divide-gray-100">
                        {% for s in students %}
                        <tr class="hover:bg-gray-50/50">
                            <td class="p-4 font-bold text-gray-900">{{ s.roll_no }}</td>
                            <td class="p-4 font-semibold">{{ s.name }}</td>
                            <td class="p-4"><span class="px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 font-bold">{{ s.course_type }}</span></td>
                            <td class="p-4 font-medium">{{ s.batch }}</td>
                            <td class="p-4 text-gray-500">{{ s.email }}</td>
                            <td class="p-4 text-gray-500">{{ s.phone or 'N/A' }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</body>
</html>
