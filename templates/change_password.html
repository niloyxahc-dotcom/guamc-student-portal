<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - GUAMC</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">
    <!-- Navbar -->
    <nav class="bg-emerald-800 text-white px-6 py-4 flex justify-between items-center shadow-md">
        <div>
            <h1 class="font-bold text-lg">Govt. Unani & Ayurvedic Medical College</h1>
            <p class="text-xs text-emerald-200">Change Password</p>
        </div>
        <div class="space-x-3">
            <a href="/dashboard" class="text-sm bg-emerald-700 hover:bg-emerald-600 px-3 py-1.5 rounded transition">Dashboard</a>
            <a href="/logout" class="text-sm bg-emerald-950 hover:bg-emerald-900 px-3 py-1.5 rounded transition">Logout</a>
        </div>
    </nav>

    <!-- Form Container -->
    <main class="max-w-md mx-auto p-6 mt-10">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
            <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">Update Password</h2>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="text-sm p-3 rounded-lg mb-4 text-center border {% if category == 'error' %}bg-red-50 text-red-600 border-red-200{% else %}bg-green-50 text-green-700 border-green-200{% endif %}">
                      {{ message }}
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST" action="/change-password" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Current Password</label>
                    <input type="password" name="current_password" required placeholder="••••••••"
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-600 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">New Password (min 6 chars)</label>
                    <input type="password" name="new_password" required placeholder="••••••••"
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-600 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Confirm New Password</label>
                    <input type="password" name="confirm_password" required placeholder="••••••••"
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-600 text-sm">
                </div>
                <button type="submit" 
                        class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-medium py-2 rounded-lg transition duration-200 text-sm">
                    Save New Password
                </button>
            </form>
        </div>
    </main>
</body>
</html>
