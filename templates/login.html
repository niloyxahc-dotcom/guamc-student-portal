<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUAMC Student Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-emerald-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white max-w-md w-full rounded-3xl shadow-xl border border-emerald-100 p-8 space-y-6">
        
        <div class="text-center space-y-2">
            <img src="{{ url_for('static', filename='logo.jpeg') }}" alt="GUAMC Logo" class="h-16 w-auto mx-auto object-contain">
            <h1 class="text-xl font-extrabold text-emerald-950">Government Unani and Ayurvedic Medical College</h1>
            <p class="text-xs text-gray-500">Mirpur-13, Dhaka-1221</p>
            <span class="inline-block px-3 py-1 bg-emerald-100 text-emerald-800 text-[11px] font-bold rounded-full mt-1">Official Student Portal</span>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="p-3 text-xs font-semibold rounded-xl bg-rose-50 text-rose-700 border border-rose-200">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Email Address</label>
                <input type="email" name="email" required placeholder="name@gmail.com" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-emerald-600 text-sm">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Password</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-emerald-600 text-sm">
                <p class="text-[11px] text-gray-400 mt-1">Default password: <span class="font-bold text-gray-600">guamc123</span></p>
            </div>

            <button type="submit" class="w-full py-3 bg-emerald-800 hover:bg-emerald-900 text-white font-bold rounded-xl transition shadow-md text-sm">
                Sign In to Dashboard
            </button>
        </form>

    </div>

</body>
</html>
