{% extends "base.html" %}
{% block title %}Student Sign Up - GUAMC Portal{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto px-4 py-8">
    <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-xl space-y-6">
        
        <div class="text-center">
            <h1 class="text-2xl font-black text-slate-900 tracking-tight">Create Student Account</h1>
            <p class="text-xs text-slate-500 font-semibold mt-1">37th Batch • Govt. Unani &amp; Ayurvedic Medical College</p>
            <div class="mt-3 inline-block px-3 py-1.5 bg-amber-50 border border-amber-200 text-amber-900 text-[11px] font-black rounded-xl">
                🛡️ Account requires Administrator approval before login
            </div>
        </div>

        <form method="POST" action="{{ url_for('signup') }}" class="space-y-3 text-xs font-bold">
            <div>
                <label class="text-slate-700">Full Name (English)*</label>
                <input type="text" name="name_english" required placeholder="e.g. MD. REZAUL SALIM" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl mt-1 uppercase">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="text-slate-700">নাম (বাংলায়)</label>
                    <input type="text" name="name_bangla" placeholder="ঐচ্ছিক" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl mt-1">
                </div>
                <div>
                    <label class="text-slate-700">Father's Name</label>
                    <input type="text" name="father_name" placeholder="Father's Name" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl mt-1">
                </div>
            </div>

            <div>
                <label class="text-slate-700">Email Address (Google/Personal)*</label>
                <input type="email" name="email" required placeholder="student@gmail.com" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl mt-1">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-slate-700">Course*</label>
                    <select name="course" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl mt-1 font-bold">
                        <option value="BUMS">BUMS (Unani)</option>
                        <option value="BAMS">BAMS (Ayurvedic)</option>
                    </select>
                </div>
                <div>
                    <label class="text-slate-700">Class Roll No*</label>
                    <input type="text" name="roll_no" required placeholder="16" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl mt-1">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="text-slate-700">Student Contact No*</label>
                    <input type="text" name="contact_number" required placeholder="017XXXXXXXX" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl mt-1">
                </div>
                <div>
                    <label class="text-slate-700">Emergency Medical Contact*</label>
                    <input type="text" name="emergency_medical_contact" required placeholder="018XXXXXXXX" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl mt-1">
                </div>
            </div>

            <div>
                <label class="text-slate-700">Blood Group</label>
                <select name="blood_group" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl mt-1 font-bold">
                    <option value="">Select Blood Group</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                </select>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                <div>
                    <label class="text-slate-700">Password*</label>
                    <input type="password" name="password" required placeholder="••••••••" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl mt-1">
                </div>
                <div>
                    <label class="text-slate-700">Confirm Password*</label>
                    <input type="password" name="confirm_password" required placeholder="••••••••" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl mt-1">
                </div>
            </div>

            <button type="submit" class="w-full py-3 bg-emerald-800 hover:bg-emerald-900 text-white rounded-2xl font-black text-sm shadow-lg transition mt-4">
                Submit Registration for Admin Approval
            </button>
        </form>

        <div class="text-center pt-2 border-t border-slate-100">
            <p class="text-xs text-slate-500 font-bold">
                Already registered? 
                <a href="{{ url_for('login') }}" class="text-emerald-800 font-black hover:underline">Log in here</a>
            </p>
        </div>

    </div>
</div>
{% endblock %}
